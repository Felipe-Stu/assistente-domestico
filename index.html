<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Doméstico Inteligente</title>
    <!-- M28: só recursos locais (a fonte Inter do Google saiu; vale a fonte do sistema) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">🏠</span>
                <h1>Assistente Doméstico</h1>
            </div>
            <div class="status-panel">
                <button id="painel-btn" class="btn-painel" type="button" title="Painel de gastos">📊 Gastos</button>
                <button id="desligar-btn" class="btn-painel" type="button" title="Desligar o assistente (fechar a janela não desliga: o celular continua funcionando)">⏻</button>
                <div class="status-indicator">
                    <span id="status-dot" class="dot dot-starting"></span>
                    <span id="status-text">Conectando...</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Sidebar Panel -->
            <aside class="control-panel">
                <div class="panel-section">
                    <h2>Controles</h2>
                    <div class="control-group">
                        <!-- Toggle Switch de Modo Voz -->
                        <div class="voice-toggle-container">
                            <div class="voice-toggle-header">
                                <span class="voice-toggle-label">Modo Voz</span>
                                <label class="toggle-switch" id="voice-mode-switch">
                                    <input type="checkbox" id="voice-mode-checkbox">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div id="voice-status-badge" class="voice-status-badge badge-inactive">
                                <span class="badge-icon">🔇</span>
                                <span class="badge-text">Desativado</span>
                            </div>
                        </div>

                        <hr class="control-divider">

                        <!-- Botão Mute (TTS) -->
                        <button id="mute-toggle-btn" class="btn btn-audio-on">
                            <span class="btn-icon">🔊</span>
                            <span class="btn-text">Áudio Ativado</span>
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>Terminal Interno</h2>
                    <div id="debug-log-area" class="debug-log">
                        <p class="debug-msg system-msg">[Sistema] Conectando ao back-end...</p>
                    </div>
                </div>
            </aside>

            <!-- Chat Container -->
            <section class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message assistant-msg">
                        <div class="msg-avatar">🤖</div>
                        <div class="msg-content">
                            <p>Olá! Estou pronto para ajudar você na gestão doméstica. O que deseja fazer?</p>
                            <span class="msg-time">Sistema</span>
                        </div>
                    </div>
                </div>

                <!-- Input area — HABILITADO desde o início -->
                <div class="chat-input-area">
                    <button id="attach-btn" class="btn btn-attach" title="Enviar nota fiscal (HTML, PDF ou foto) — ou arraste o arquivo para o chat">📎</button>
                    <input type="text" id="chat-input" placeholder="Digite sua mensagem aqui...">
                    <button id="send-btn" class="btn btn-send">➤</button>
                </div>
            </section>
        </main>
    </div>

    <script src="web/formatar.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
