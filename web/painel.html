<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171c1a">
    <script src="/web/tema.js"></script>
    <title>Gastos — Assistente Doméstico</title>
    <link rel="icon" href="/web/icone-192.png">
    <link rel="stylesheet" href="/web/estilo.css">
</head>
<body>
    <header class="topo">
        <span class="marca-icone" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="titulo">Gastos<small>Assistente da casa</small></span>
        <a class="botao-topo" href="/" title="Voltar à conversa" aria-label="Voltar à conversa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></a>
        <button id="tema-btn" type="button" class="botao-topo" aria-label="Mudar para o tema claro">
            <svg class="icone-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icone-lua" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <select id="meses" aria-label="Período">
            <option value="3">3 meses</option><option value="6">6 meses</option>
            <option value="12" selected>12 meses</option><option value="24">24 meses</option>
        </select>
    </header>
    <main class="painel">
        <div id="aviso" class="aviso" hidden></div>
        <section class="cartoes" id="cartoes"></section>
        <section class="bloco"><h2>Por mês <small class="dica">toque num mês para ver só ele</small></h2><div id="por-mes"></div></section>
        <section class="bloco" id="bloco-detalhe">
            <h2>Para onde foi o dinheiro</h2>
            <nav class="trilha" id="trilha" aria-label="Caminho"></nav>
            <div class="resumo-nivel" id="resumo-nivel"></div>
            <div class="detalhe" id="detalhe"></div>
        </section>
        <section class="bloco"><h2>Por loja</h2><div id="por-loja"></div></section>
        <section class="bloco"><h2>Últimas compras</h2><table class="tabela" id="ultimas"></table></section>
    </main>
    <script src="/web/formatar.js"></script>
    <script src="/web/painel.js"></script>
</body>
</html>
