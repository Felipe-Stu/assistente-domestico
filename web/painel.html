<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Gastos — Assistente Doméstico</title>
    <link rel="icon" href="/web/icone-192.png">
    <link rel="stylesheet" href="/web/estilo.css">
</head>
<body>
    <header class="topo">
        <a class="link-painel" href="/" title="Voltar à conversa">💬</a>
        <span class="titulo">📊 Gastos</span>
        <select id="meses" aria-label="Período">
            <option value="3">3 meses</option><option value="6">6 meses</option>
            <option value="12" selected>12 meses</option><option value="24">24 meses</option>
        </select>
    </header>
    <main class="painel">
        <div id="aviso" class="aviso" hidden></div>
        <section class="cartoes" id="cartoes"></section>
        <section class="bloco"><h2>Por mês <small class="dica">toque num mês para ver só ele</small></h2><div id="por-mes"></div></section>
        <section class="bloco" id="bloco-detalhe">
            <h2>Para onde foi o dinheiro</h2>
            <nav class="trilha" id="trilha" aria-label="Caminho"></nav>
            <div class="resumo-nivel" id="resumo-nivel"></div>
            <div class="detalhe" id="detalhe"></div>
        </section>
        <section class="bloco"><h2>Por loja</h2><div id="por-loja"></div></section>
        <section class="bloco"><h2>Últimas compras</h2><table class="tabela" id="ultimas"></table></section>
    </main>
    <script src="/web/formatar.js"></script>
    <script src="/web/painel.js"></script>
</body>
</html>
