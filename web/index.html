<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171c1a">
    <script src="/web/tema.js"></script>
    <title>Assistente Doméstico</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/web/icone-192.png">
    <link rel="apple-touch-icon" href="/web/icone-192.png">
    <link rel="stylesheet" href="/web/estilo.css">
</head>
<body>
    <header class="topo">
        <span class="marca-icone" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="titulo">Assistente<small id="estado" class="estado">conectando…</small></span>
        <button id="tema-btn" type="button" class="botao-topo" aria-label="Mudar para o tema claro">
            <svg class="icone-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icone-lua" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="botao-topo" href="/painel" title="Painel de gastos" aria-label="Painel de gastos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
    </header>
    <main id="mensagens" class="mensagens" aria-live="polite"></main>
    <div id="aviso" class="aviso" hidden></div>
    <form id="envio" class="envio" autocomplete="off">
        <label class="botao-anexo" title="Tirar foto da nota">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input id="camera" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <label class="botao-anexo" title="Escolher foto, PDF ou HTML da nota">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg><input id="anexo" type="file" accept="image/*,.pdf,.html,.htm" multiple hidden>
        </label>
        <input id="texto" type="text" placeholder="Mensagem ou compra…" enterkeyhint="send">
        <button id="enviar" type="submit" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <script src="/web/formatar.js"></script>
    <script src="/web/app.js"></script>
</body>
</html>
